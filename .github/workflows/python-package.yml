name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.8.8"
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        uv venv
        uv pip install .
        uv run --no-project python -c "import accessible_output2"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx --from flake8==7.1.2 flake8 . --extend-exclude=.venv,build,dist --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uvx --from flake8==7.1.2 flake8 . --extend-exclude=.venv,build,dist --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with unittest
      run: uv run --no-project python -m unittest discover -s tests -v
    - name: Build package
      run: uv build
