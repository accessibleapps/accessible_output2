name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.8.8"
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        uv venv
        uv pip install .
        uv run --no-project python -c "import accessible_output2"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx --from flake8==7.1.2 flake8 . --extend-exclude=.venv,build,dist --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uvx --from flake8==7.1.2 flake8 . --extend-exclude=.venv,build,dist --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with unittest
      run: uv run --no-project python -m unittest discover -s tests -v
    - name: Build package
      run: uv build

  macos:
    name: macOS package and offline tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            python-version: "3.8"
          - os: macos-15
            python-version: "3.10"
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.8.8"
        python-version: ${{ matrix.python-version }}
    - name: Build distributions and install the wheel's declared dependencies
      run: |
        uv build
        uv venv --python "$PYTHON_VERSION"
        uv pip install dist/*.whl
        uv pip check
        uv pip list
    - name: Import installed macOS providers without speaking
      working-directory: ${{ runner.temp }}
      run: |
        "$GITHUB_WORKSPACE/.venv/bin/python" -c "import sys, platform, accessible_output2; from importlib.metadata import version; from AppKit import NSSpeechSynthesizer; from accessible_output2.outputs.voiceover import VoiceOver; from accessible_output2.outputs.system_voiceover import SystemVoiceOver; print(sys.version, platform.machine(), accessible_output2.__file__, version('pyobjc-framework-Cocoa'), VoiceOver.__name__, SystemVoiceOver.__name__)"
    - name: Run controlled dispatch tests without native speech
      run: .venv/bin/python -m unittest discover -s tests -v
